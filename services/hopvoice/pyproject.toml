[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hopwhistle-hopvoice"
version = "0.3.0"
description = "Hopwhistle first-party neural voice inference service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
# qwen-tts declares only transformers>=4.57.3, and newer transformers releases
# break its tokenizer import (check_model_inputs signature change). Pin the
# version upstream Qwen3-TTS is released against so image builds stay loadable.
qwen = [
  "qwen-tts==0.1.1",
  "transformers==4.57.3",
  "torch>=2.6",
  "torchaudio>=2.6",
]
qwen-streaming = [
  "qwen-tts @ git+https://github.com/rekuenkdr/Qwen3-TTS-streaming.git@b8db6ff1cebc0d6554cf0977045850bcc796b383",
  "transformers==4.57.3",
  "torch>=2.6",
  "torchaudio>=2.6",
]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
]
# Optional listening-pack analysis (ASR intelligibility, pitch, pace).
bench = [
  "websockets>=13",
  "soundfile>=0.12",
  "librosa>=0.10",
  "faster-whisper>=1.0",
  "jiwer>=3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hopvoice*", "tools*", "bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
