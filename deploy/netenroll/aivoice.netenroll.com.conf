# aivoice.netenroll.com — Dograh served on the netenroll registrable domain.
#
# WHY THIS HOSTNAME EXISTS
# The agency portal at https://agents.netenroll.com signs users into Dograh by
# setting the `dograh_auth_token` / `dograh_auth_user` cookies. Per RFC 6265
# domain-matching, a cookie set by agents.netenroll.com cannot be scoped to
# aivoice.hopwhistle.com, and SameSite=Lax cookies are not sent into a cross-site
# frame. Serving Dograh at aivoice.netenroll.com puts both sides back on one
# registrable domain (netenroll.com), so a `Domain=.netenroll.com` cookie is sent
# into the iframe as first-party. A redirect to the hopwhistle host would NOT
# work — the app has to be served on this hostname.
#
# This file is ADDITIVE. It does not touch the existing aivoice.hopwhistle.com
# vhost; both hostnames serve the same upstreams until the old one is retired.
#
# This vhost is the "host nginx reverse-proxies the published container ports"
# layout. Confirm that is how this box actually serves Dograh before installing
# it — see README.md in this directory, "Which architecture is this box?".

# Only send `Connection: upgrade` on requests that actually asked to upgrade.
# Hardcoding `Connection "upgrade"` sends the hop-by-hop header on every plain
# HTTP request too. Named with a dograh_ prefix so it cannot collide with a map
# of the same name in the agents.netenroll.com vhost.
map $http_upgrade $dograh_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # IPv6 is intentionally left out: Step 2 of this migration adds an A record
    # only, and on a host without IPv6 a `listen [::]` line makes nginx fail to
    # start outright — which would take agents.netenroll.com down with it. If
    # this box has IPv6 and you add an AAAA record, uncomment here and in the
    # 443 block below.
    # listen [::]:80;
    server_name aivoice.netenroll.com;

    # Let's Encrypt HTTP-01 challenge. Must stay reachable on port 80 for both
    # issuance and every later renewal, so this location comes before the
    # redirect. A server-level `return 301` would fire ahead of location
    # matching and hijack the challenge.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # listen [::]:443 ssl;   # see the IPv6 note in the port-80 server above
    server_name aivoice.netenroll.com;

    # HTTP/2 is left off because the directive is version-dependent and a bad
    # `nginx -t` here blocks reloading the agents.netenroll.com vhost too.
    # To enable it, add the form matching this box's `nginx -v`:
    #   nginx >= 1.25.1:  http2 on;
    #   nginx <  1.25.1:  append `http2` to the listen directives above.

    ssl_certificate     /etc/letsencrypt/live/aivoice.netenroll.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aivoice.netenroll.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_aivoice_netenroll:10m;
    ssl_session_timeout 1d;

    # Permit embedding from the portal, and from ourselves so Dograh's own
    # in-app frames keep working. `always` so the header is also sent on 4xx/5xx
    # error responses, which would otherwise be framed without a policy.
    #
    # NOTE: `add_header` does not merge across levels — a `location` block that
    # declares its own add_header drops every header inherited from here. None of
    # the locations below add headers, so this server-level directive applies
    # throughout. Keep it that way, or repeat the header in any location you add.
    #
    # Do NOT add X-Frame-Options here: it has no origin-list form, so
    # SAMEORIGIN would block the portal outright in browsers that honour it.
    add_header Content-Security-Policy "frame-ancestors 'self' https://agents.netenroll.com" always;

    # Dograh streams live call audio over WebSockets; uploads can be large.
    client_max_body_size 100M;

    # Backend API and WebSockets.
    #
    # CRITICAL: this is `/api/v1/`, NOT `/api`. The Next.js UI serves its own
    # routes under /api/ on port 3010 — /api/auth/oss, /api/auth/session,
    # /api/auth/logout and /api/config/*. Those are exactly the endpoints that
    # read the dograh_auth_token cookie and hand the session to the browser.
    # Proxying all of /api to the FastAPI backend 404s them and breaks the
    # portal sign-in this hostname exists to fix. Only /api/v1/ is the backend
    # (api/app.py: API_PREFIX = "/api/v1").
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dograh_connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # uvicorn runs with FORWARDED_ALLOW_IPS=*, so it honours this. Inbound
        # telephony webhook signatures are computed over the public https URL —
        # drop this header and every provider's signature check fails at once.
        proxy_set_header X-Forwarded-Proto https;

        # Long-lived WebSockets (audio streaming, signaling).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Don't buffer streamed responses.
        proxy_buffering off;
    }

    # Call recordings are served from MinIO, which nginx proxies under the app
    # origin. Omit this and recording playback 404s — the most visible symptom
    # inside the portal iframe, since the page is there to show calls.
    location /voice-audio/ {
        proxy_pass http://127.0.0.1:9000/voice-audio/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dograh_connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Safety net matching Dograh's own remote template: rewrite any
        # localhost MinIO URL left in an API response to this origin. Correct
        # MINIO_PUBLIC_ENDPOINT / PUBLIC_BASE_URL config makes this a no-op.
        sub_filter 'http://localhost:9000/voice-audio/' 'https://$host/voice-audio/';
        sub_filter_once off;
        # text/html is always filtered by default; naming it again warns
        # "duplicate MIME type" on every config test.
        sub_filter_types application/json;
    }
}
