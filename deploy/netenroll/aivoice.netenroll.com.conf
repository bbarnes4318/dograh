# aivoice.netenroll.com — Dograh served on the portal's registrable domain.
#
# Derived from the WORKING /etc/nginx/sites-available/aivoice vhost. Only the
# hostname, certificate, framing policy and the ACME location differ; every
# proxy rule below is copied from the vhost that already serves this app, so
# routing cannot drift from what is known to work.
#
# Why this host exists: agents.netenroll.com cannot set a cookie scoped to
# aivoice.hopwhistle.com (RFC 6265 domain-match), and SameSite=Lax cookies are
# not sent into a cross-site frame. Same registrable domain restores both.

server {
    listen 80;
    server_name aivoice.netenroll.com;

    # Must stay ABOVE the redirect. Let's Encrypt does follow a 301 to HTTPS,
    # so issuance can survive without this, but serving the challenge directly
    # removes that dependency for every future renewal.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hopwhistle;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name aivoice.netenroll.com;

    ssl_certificate     /etc/letsencrypt/live/aivoice.netenroll.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aivoice.netenroll.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Embedding policy. Dograh emits no X-Frame-Options and no CSP of its own,
    # so this is a narrowing, not a loosening. 'self' is kept so the app's own
    # internal frames keep working. proxy_hide_header guards against an
    # upstream X-Frame-Options appearing later and being obeyed by old browsers.
    #
    # add_header does NOT merge across levels: any location that declares its
    # own add_header drops this one. No location below adds headers — keep it
    # that way, or repeat this line there.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    add_header Content-Security-Policy "frame-ancestors 'self' https://agents.netenroll.com" always;

    # Backend API + long-lived WebSockets (audio streaming / signaling).
    #
    # /api/v1/ — NOT /api. The Next.js UI serves its own /api/auth/oss,
    # /api/auth/session, /api/auth/logout and /api/config/* on :3010, and those
    # are the routes that read the dograh_auth_token cookie and hand the session
    # to the browser. Proxying all of /api to FastAPI 404s them and breaks the
    # portal sign-in this vhost exists to restore.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_next_upstream error timeout http_502 http_503 http_504;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        client_max_body_size 100M;
    }

    # Recorded/streamed audio from Dograh's MinIO (remapped to :19000 on this
    # box). Omit this and recording playback 404s inside the iframe.
    location /voice-audio/ {
        proxy_pass http://127.0.0.1:19000/voice-audio/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        client_max_body_size 100M;
    }

    # UI (Next.js). Host $host so Next builds absolute URLs from the public
    # hostname rather than 127.0.0.1.
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        sub_filter 'http://localhost:9000/voice-audio/' 'https://$host/voice-audio/';
        sub_filter_once off;
        sub_filter_types application/json;
    }
}
